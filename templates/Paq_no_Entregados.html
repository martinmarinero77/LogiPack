<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" integrity="sha384-nU14brUcp6StFntEOOEBvcJm4huWjB0OcIeQ3fltAfSmuZFrkAif0T+UtNGlKKQv" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename= 'css/estilos.css')}}">
    <title>Paquetes no Entregados</title>
</head>
<body>
    <br>
    <a id="btnI" href="{{ url_for('Inicio') }}">Volver a Inicio</a>
    <a id="btnI" href="{{ url_for('Elegir_Sucursal') }}">Elegir Otra Sucursal</a>
    <div id="container6"><br>
    <ul class="list-group list-group-horizontal">
        <li class="list-group-item"><h6>Identificador: {{sucursal.id}}</h6></li>
        <li class="list-group-item"><h6>Sucursal Número: {{sucursal.numero}}</h6></li>
        <li class="list-group-item"><h6>Provincia: {{sucursal.provincia}}</h6></li>
        <li class="list-group-item"><h6>Localidad: {{sucursal.localidad}}</h6></li>
    </ul>
    <br>
    <h2>Seleccione uno o más paquetes para asignar al transporte</h2>
    <form action="{{ url_for('Transporte_Registrado', sucursal_id=sucursal.id) }}" method="post">
        <div ><br>
            {% for paquete in paquetes %}
            <input class="form-check-input" name="paquetes_seleccionados[]" type="checkbox" value="{{ paquete.id }}" id="paquetes">
            <label class="form-check-label" for="paquetes">
                <h5>Número de paquete: {{ paquete.numeroEnvio }} - Nombre del Destinatario: {{ paquete.nomDestinatario }}</h5>
            </label><br>
            {% endfor %}
            <br>
            <button  class="btn btn-secondary btn-lg" type="submit">Seleccionar Paquetes</button>
            <br><br>
        </div>
    </form>
</div>
</body>
