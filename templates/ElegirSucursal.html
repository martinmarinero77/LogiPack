<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" integrity="sha384-nU14brUcp6StFntEOOEBvcJm4huWjB0OcIeQ3fltAfSmuZFrkAif0T+UtNGlKKQv" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename= 'css/estilos.css')}}">
    <title>Elegir Sucursal</title>
</head>
<body>
    <div id="container2">
        <br>
        <form action="{{ request.path }}" method="post">
            <div class="col-md-4">
                <label for="sucursales" class="form-label"><h1>Sucursales</h1></label>
                <br>
                <img src="static/img/sucursales.png" alt="">
                <p><h4>Seleccione una sucursal para operar</h4></p>
                
                <select name="sucursales" id="sucursales" class="form-select">
                    <option value="">Todas las Sucursales</option>
                    {% for sucursal in sucursales %}
                        <option value="{{ sucursal.id }}">
                            <strong>Número:</strong> {{ sucursal.numero }},
                            <strong>Provincia:</strong> {{ sucursal.provincia }},
                            <strong>Localidad:</strong> {{ sucursal.localidad }}
                        </option>
                    {% endfor %}
                </select><br>
                <div class="d-grid gap-2 col-6 mx-auto">
                    <button  class="btn btn-secondary btn-lg" type="submit">Elegir Sucursal</button>
                </div>
            </div>
        </form>
        <br>
    </div>
</body>
</html>
