<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" integrity="sha384-nU14brUcp6StFntEOOEBvcJm4huWjB0OcIeQ3fltAfSmuZFrkAif0T+UtNGlKKQv" crossorigin="anonymous">
    <link rel="stylesheet" href="{{url_for('static', filename= 'css/estilos.css')}}">
    <title>Elegir Sucursal</title>
</head>
<body>
  <div id="container4"><br>
    <h1>Registrar paquete</h1>
    <br>
    <ul class="list-group list-group-horizontal">
        <li class="list-group-item"><h3>Identificador: {{sucursal.id}}</h3></li>
        <li class="list-group-item"><h3>Sucursal Número: {{sucursal.numero}}</h3></li>
        <li class="list-group-item"><h3>Provincia: {{sucursal.provincia}}</h3></li>
        <li class="list-group-item"><h3>Localidad: {{sucursal.localidad}}</h3></li>
    </ul>
    <a id="btnI" href="{{ url_for('Inicio') }}">Volver a Inicio</a>
    <a id="btnI" href="{{ url_for('Elegir_Sucursal') }}">Elegir Otra Sucursal</a>
    <form action="{{ request.path }}" method="post">
        <br><div class="mb-3">
          <h3>Ingrese los datos del paquete</h3>
          <label for="peso" class="form-label"><h5>Peso del Paquete</h5></label>
          <input type="number" step='any' name="peso" class="form-control">
        </div>
        <div class="mb-3">
            <label for="nombre" class="form-label"><h5>Nombre del Destinatario</h5></label>
            <input type="text" name="nombre" class="form-control">
          </div>
        <div class="mb-3">
            <label for="Dirección" class="form-label"><h5>Direccion del Destinatario</h5></label>
            <input type="text" name="direccion" class="form-control">
        </div>
        <br>
        <div class="d-grid gap-2 col-6 mx-auto">
          <button  class="btn btn-secondary btn-lg" type="submit">Registrar Paquete</button>
      </div>
    </form>
  </div>
</body>
